<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Українське Радіо</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d1b1e, #1b263b);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #ffffff;
            padding: 24px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.3);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .container {
            flex: 1;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 130px;
        }

        .station-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .station-card {
            background: rgba(25, 35, 45, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.4s ease forwards;
        }

        .station-card:hover {
            transform: translateY(-2px);
            background: rgba(35, 48, 62, 0.9);
        }

        .station-card:active {
            transform: scale(0.97);
        }

        .station-card.active {
            border-color: #10b981;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(25, 35, 45, 0.9));
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .station-info h3 {
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .station-info p {
            font-size: 13px;
            color: #94a3b8;
        }

        .equalizer {
            display: none;
            gap: 3px;
            align-items: flex-end;
            height: 20px;
            width: 24px;
        }

        .station-card.active .equalizer {
            display: flex;
        }

        .bar {
            width: 4px;
            background-color: #10b981;
            border-radius: 2px;
            animation: bounce 0.6s infinite alternate;
        }

        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { height: 4px; }
            100% { height: 18px; }
        }

        .play-icon {
            font-size: 20px;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .station-card.active .play-icon {
            display: none;
        }

        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
        }

        .current-track {
            max-width: 50%;
        }

        .current-track h4 {
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #ffffff;
        }

        .current-track p {
            font-size: 12px;
            color: #10b981;
            margin-top: 2px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .controls button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .controls button:hover {
            transform: scale(1.05);
        }

        .controls button:active {
            transform: scale(0.92);
        }

        .controls button#playBtn {
            width: 54px;
            height: 54px;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🟢 Українське Радіо</h1>
    </header>

    <div class="container">
        <div class="station-list" id="stationList"></div>
    </div>

    <div class="player-bar">
        <div class="current-track">
            <h4 id="currentName">Оберіть станцію</h4>
            <p id="statusText">Готовий до ефіру</p>
        </div>
        <div class="controls">
            <button onclick="prevStation()" title="Попередня">⏮</button>
            <button id="playBtn" onclick="togglePlay()">▶</button>
            <button onclick="nextStation()" title="Наступна">⏭</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        const stations = [
            {
                name: "Наше Радіо",
                genre: "Українські хіти",
                url: "https://online.nasheradio.ua/NasheRadio"
            },
            {
                name: "Хіт FM",
                genre: "Популярна музика",
                url: "https://online.hitfm.ua/HitFM"
            }
        ];

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const currentName = document.getElementById('currentName');
        const statusText = document.getElementById('statusText');
        const stationList = document.getElementById('stationList');

        let currentIndex = -1;
        let isPlaying = false;

        function renderStations() {
            stationList.innerHTML = '';
            stations.forEach((station, index) => {
                const card = document.createElement('div');
                card.className = `station-card ${currentIndex === index ? 'active' : ''}`;
                card.onclick = () => selectStation(index);

                card.innerHTML = `
                    <div class="station-info">
                        <h3>${station.name}</h3>
                        <p>${station.genre}</p>
                    </div>
                    <div class="equalizer">
                        <div class="bar"></div>
                        <div class="bar"></div>
                        <div class="bar"></div>
                    </div>
                    <div class="play-icon">▶</div>
                `;
                stationList.appendChild(card);
            });
        }

        function selectStation(index) {
            currentIndex = index;
            const station = stations[currentIndex];
            
            currentName.innerText = station.name;
            statusText.innerText = "Завантаження...";
            renderStations();

            audio.pause();
            audio.src = station.url;

            audio.play()
                .then(() => {
                    isPlaying = true;
                    playBtn.innerText = '⏸';
                    statusText.innerText = "Прямий ефір";
                    renderStations();
                    updateMediaSession();
                })
                .catch(error => {
                    console.error("Помилка відтворення:", error);
                    statusText.innerText = "Помилка підключення";
                    isPlaying = false;
                    playBtn.innerText = '▶';
                    renderStations();
                });
        }

        function togglePlay() {
            if (currentIndex === -1) {
                selectStation(0);
                return;
            }

            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                playBtn.innerText = '▶';
                statusText.innerText = "Пауза";
            } else {
                audio.play();
                isPlaying = true;
                playBtn.innerText = '⏸';
                statusText.innerText = "Прямий ефір";
            }
            renderStations();
        }

        function nextStation() {
            let nextIndex = (currentIndex + 1) % stations.length;
            selectStation(nextIndex);
        }

        function prevStation() {
            let prevIndex = (currentIndex - 1 + stations.length) % stations.length;
            selectStation(prevIndex);
        }

        function updateMediaSession() {
            if ('mediaSession' in navigator) {
                const station = stations[currentIndex];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: station.name,
                    artist: 'Українське Радіо',
                    album: station.genre,
                    artwork: [
                        { src: 'https://cdn-icons-png.flaticon.com/512/3076/3076897.png', sizes: '512x512', type: 'image/png' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', function() {
                    audio.play();
                    isPlaying = true;
                    playBtn.innerText = '⏸';
                    statusText.innerText = "Прямий ефір";
                    renderStations();
                });

                navigator.mediaSession.setActionHandler('pause', function() {
                    audio.pause();
                    isPlaying = false;
                    playBtn.innerText = '▶';
                    statusText.innerText = "Пауза";
                    renderStations();
                });

                navigator.mediaSession.setActionHandler('nexttrack', function() {
                    nextStation();
                });

                navigator.mediaSession.setActionHandler('previoustrack', function() {
                    prevStation();
                });
            }
        }

        renderStations();
    </script>
</body>
</html>
